name: Build and publish game

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish an active publication before starting another one.
concurrency:
  group: game-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Restore Godot and export templates
        id: godot-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/bin/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_VERSION }}-release-v1

      - name: Install Godot and matching export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          editor="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          templates="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 -O "$base/$editor"
          curl --fail --location --retry 3 -O "$base/$templates"
          curl --fail --location --retry 3 -O "$base/SHA512-SUMS.txt"
          # Verify both downloads against the official release checksums.
          grep -F " $editor" SHA512-SUMS.txt | sha512sum --check --strict
          grep -F " $templates" SHA512-SUMS.txt | sha512sum --check --strict
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/godot/export_templates"
          unzip -q "$editor" -d godot-editor
          install -m 755 "godot-editor/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/.local/bin/godot"
          unzip -q "$templates" \
            templates/linux_release.x86_64 \
            templates/windows_release_x86_64.exe \
            templates/web_nothreads_release.zip \
            -d godot-templates
          mv godot-templates/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Add Godot to PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Import and export all platforms
        run: bash scripts/build-release.sh

      - name: Upload desktop downloads
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-downloads
          path: export/downloads/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: export/web

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: desktop-downloads
          path: downloads

      - name: Publish desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          tag="build-$RUN_ID"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" downloads/* --clobber
          else
            gh release create "$tag" downloads/* \
              --target "$COMMIT" \
              --title "Main build $RUN_NUMBER" \
              --notes "Automated build of commit $COMMIT. Download and extract the archive for your platform. These are unsigned x86_64 builds." \
              --latest
          fi

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy web build
        id: deployment
        uses: actions/deploy-pages@v4
